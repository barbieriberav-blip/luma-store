services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en server/.env}
      POSTGRES_DB: luma_store
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - luma_pgdata:/var/lib/postgresql/data
volumes:
  luma_pgdata:
