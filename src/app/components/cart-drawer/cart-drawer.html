<div class="drawer-overlay" *ngIf="cartService.isDrawerOpen$ | async" (click)="cartService.closeDrawer()"></div>

<div class="cart-drawer shadow-lg" [class.open]="cartService.isDrawerOpen$ | async">
  <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light">
    <h5 class="mb-0 fw-bold"><i class="bi bi-bag me-2"></i>Bolsa de Compras</h5>
    <button class="btn-close" (click)="cartService.closeDrawer()"></button>
  </div>

  <div class="drawer-body p-3 flex-grow-1 overflow-auto">
    <div *ngIf="(cartService.cartItems$ | async)?.length === 0" class="text-center py-5 text-muted">
      <i class="bi bi-cart-x fs-1 d-block mb-3"></i>
      <p class="mb-0">Tu carrito está vacío</p>
    </div>

    <div *ngFor="let item of cartService.cartItems$ | async; let i = index" class="d-flex gap-3 mb-3 border-bottom pb-3">
      <img [src]="item.product.images[0]" [alt]="item.product.name" class="rounded object-fit-cover" style="width: 70px; height: 85px;">
      <div class="flex-grow-1">
        <div class="d-flex justify-content-between align-items-start">
          <h6 class="mb-1 text-truncate" style="max-width: 170px;">{{ item.product.name }}</h6>
          <button class="btn btn-sm text-danger p-0" (click)="cartService.removeFromCart(i)"><i class="bi bi-trash"></i></button>
        </div>
        <div class="small text-muted mb-2">Talla: {{ item.selectedSize }} | Color: {{ item.selectedColor }}</div>
        <div class="d-flex justify-content-between align-items-center">
          <div class="btn-group btn-group-sm border rounded">
            <button class="btn btn-light py-0 px-2" (click)="cartService.updateQuantity(i, -1)">-</button>
            <span class="px-2 py-1 bg-white fw-bold">{{ item.quantity }}</span>
            <button class="btn btn-light py-0 px-2" (click)="cartService.updateQuantity(i, 1)">+</button>
          </div>
          <span class="fw-bold">${{ (item.product.price * item.quantity) | number:'1.2-2' }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="p-3 border-top bg-light" *ngIf="(cartService.cartItems$ | async)?.length">
    <div class="d-flex justify-content-between fw-bold mb-3 fs-5">
      <span>Subtotal:</span>
      <span>${{ cartService.getSubtotal() | number:'1.2-2' }}</span>
    </div>
    <a routerLink="/checkout" (click)="cartService.closeDrawer()" class="btn btn-dark w-100 py-2 fw-semibold">
      Ir al Checkout <i class="bi bi-arrow-right ms-2"></i>
    </a>
  </div>
</div>
