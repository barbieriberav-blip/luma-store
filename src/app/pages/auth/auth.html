<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 shadow-sm border-0">
        <h3 class="fw-bold text-center mb-4">{{ isLogin ? 'Iniciar Sesión' : 'Crear Cuenta en Luma' }}</h3>
        
        <div *ngIf="errorMessage" class="alert alert-danger py-2 small">{{ errorMessage }}</div>

        <form (ngSubmit)="onSubmit()">
          <div class="mb-3" *ngIf="!isLogin">
            <label class="form-label small">Nombre Completo</label>
            <input type="text" class="form-control" [(ngModel)]="name" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label small">Correo Electrónico</label>
            <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label small">Contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
          </div>

          <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
            {{ isLogin ? 'Ingresar' : 'Registrarme' }}
          </button>
        </form>

        <div class="text-center mt-4">
          <button class="btn btn-link text-decoration-none small text-dark" (click)="toggleMode()">
            {{ isLogin ? '¿No tienes cuenta? Regístrate aquí' : '¿Ya tienes cuenta? Inicia sesión' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
