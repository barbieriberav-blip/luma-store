name: Unpack LUMA repository payload

on:
  push:
    paths:
      - '.luma_upload/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify package
        shell: bash
        run: |
          cat .luma_upload/chunk_*.txt | tr -d '\r\n' | base64 --decode > /tmp/luma_repo_payload.zip
          expected="$(awk '{print $1}' .luma_upload/SHA256.txt)"
          actual="$(sha256sum /tmp/luma_repo_payload.zip | awk '{print $1}')"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$expected" = "$actual"
          unzip -oq /tmp/luma_repo_payload.zip -d .
          rm -rf .luma_upload

      - name: Commit final repository structure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: add LUMA documents and Firebase project"
            git push
          fi
